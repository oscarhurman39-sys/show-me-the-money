<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A5 portrait; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 148mm; height: 210mm; font-family: Georgia, 'Times New Roman', serif; color: #1d2b1f; background: #ffffff; }
  .page { width: 148mm; height: 210mm; padding: 9mm 9mm 7mm; display: flex; flex-direction: column; }
  .headline { font-size: 21pt; font-weight: bold; color: #1f5c2e; letter-spacing: -0.02em; }
  .subhead { font-size: 9.5pt; line-height: 1.35; margin-top: 2.5mm; color: #333; font-family: Helvetica, Arial, sans-serif; }
  .images { margin-top: 4mm; }
  .img-block { position: relative; width: 100%; }
  .img-block img { width: 100%; height: 52mm; object-fit: cover; border-radius: 2mm; display: block; }
  .img-block + .img-block { margin-top: 2.5mm; }
  .tag { position: absolute; top: 2mm; left: 2mm; font-family: Helvetica, Arial, sans-serif; font-size: 8pt; font-weight: bold; color: #fff; background: rgba(0,0,0,0.65); padding: 1mm 2.5mm; border-radius: 1mm; }
  .tag.after { background: rgba(31,92,46,0.85); }
  .body-copy { margin-top: 4mm; font-size: 9.5pt; line-height: 1.4; font-family: Helvetica, Arial, sans-serif; color: #222; }
  .footer { margin-top: auto; display: flex; align-items: center; gap: 5mm; border-top: 0.4mm solid #1f5c2e; padding-top: 3.5mm; }
  .qr { width: 24mm; height: 24mm; flex-shrink: 0; }
  .qr img { width: 100%; height: 100%; }
  .contact { font-family: Helvetica, Arial, sans-serif; }
  .cta { font-size: 11pt; font-weight: bold; color: #1f5c2e; }
  .phone { font-size: 13pt; font-weight: bold; margin-top: 1mm; }
  .code { font-size: 8.5pt; color: #555; margin-top: 1.5mm; }
  .code b { color: #1f5c2e; }
</style>
</head>
<body>
  <div class="page">
    <div class="headline">{{HEADLINE}}</div>
    <div class="subhead">{{SUBHEAD}}</div>
    <div class="images">
      <div class="img-block">
        <img src="{{BEFORE_SRC}}" alt="before">
        <div class="tag">YOUR GARDEN TODAY</div>
      </div>
      <div class="img-block">
        <img src="{{AFTER_SRC}}" alt="after">
        <div class="tag after">WHAT IT COULD BE</div>
      </div>
    </div>
    <div class="body-copy">{{BODY}}</div>
    <div class="footer">
      <div class="qr"><img src="{{QR_SRC}}" alt="QR"></div>
      <div class="contact">
        <div class="cta">{{CTA}}</div>
        <div class="phone">{{PHONE}}</div>
        <div class="code">Your house code: <b>{{CODE}}</b> — quote it so we know which garden is yours.</div>
      </div>
    </div>
  </div>
</body>
</html>
